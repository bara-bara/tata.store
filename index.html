    <!-- Polyfill/Guard for environments where window.fetch has only a getter -->
    <script>
      (function() {
        try {
          var currentFetch = (typeof window !== 'undefined' && window.fetch) 
            ? window.fetch.bind(window) 
            : null;
          
          var descriptor = {
            get: function() { return currentFetch; },
            set: function(fn) { currentFetch = fn; },
            configurable: true,
            enumerable: true
          };

          if (typeof window !== 'undefined') {
            try {
              Object.defineProperty(window, 'fetch', descriptor);
            } catch (e1) {
              try {
                if (typeof Window !== 'undefined' && Window.prototype) {
                  Object.defineProperty(Window.prototype, 'fetch', descriptor);
                }
              } catch (e2) {}
            }
          }
        } catch (err) {}
      })();
    </script>
